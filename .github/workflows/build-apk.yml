name: Build Android APK

on:
  push:
    branches:
      - main # Agar aapki main branch ka naam master hai to yahan master likhein

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js (For React/Capacitor)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor with Android Native
        run: |
          npx cap sat-up android || true
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 17 (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alarmio-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
