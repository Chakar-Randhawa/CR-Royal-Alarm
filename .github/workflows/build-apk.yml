name: Build Android APK (100% Automated)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Build Web Assets
        run: |
          npm run build || mkdir dist
      - name: Pure Automated Mobile Sync
        run: |
          rm -rf android
          # Automatically create a fresh, error-free mobile bridge native config
          npx cap init "Alarmio Pro" "com.alarmio.pro" --web-dir=dist --web-dir=build || true
          npx cap add android
          
          # Fix the relative asset path on index.html dynamically to prevent black screen
          if [ -f dist/index.html ]; then
            sed -i 's/href="\/assets\//href=".\/assets\//g' dist/index.html
            sed -i 's/src="\/assets\//src=".\/assets\//g' dist/index.html
          fi
          
          npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Wrapper & Force Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alarmio-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
