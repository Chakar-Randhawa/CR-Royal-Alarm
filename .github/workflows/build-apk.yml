name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Production Web Assets
        run: npm run build

      - name: Core Android Platform Injection
        run: |
          npx cap init "Alarmio Pro" "com.alarmio.pro" --web-dir=dist || true
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 17 (Latest Version)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: gradlew file missing in android folder"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alarmio-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
