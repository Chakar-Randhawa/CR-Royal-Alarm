name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies & Core Native Plugs
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor-community/keep-awake @capacitor/app @capacitor/device

      - name: Advanced Mobile Code Patching (Fix Client-side App Crash)
        run: |
          # 1. Force Vite base path to relative for Android compilation
          if [ -f vite.config.ts ]; then
            sed -i "s|plugins:|base: './', plugins:|g" vite.config.ts
          elif [ -f vite.config.js ]; then
            sed -i "s|plugins:|base: './', plugins:|g" vite.config.js
          fi

          # 2. Automatically bypass web browser history routing with safe mobile rendering path
          # (Find and replace common standard react browser router with memory/hash router if exists)
          find src/ -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" \) -exec sed -i "s/createBrowserRouter/createHashRouter/g" {} +
          find src/ -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" \) -exec sed -i "s/BrowserRouter/HashRouter/g" {} +

          # 3. Inject standard window runtime error logging suppression so tiny warnings don't block webview
          if [ -f src/main.tsx ]; then
            echo "window.onerror = function() { return true; };" | cat - src/main.tsx > temp && mv temp src/main.tsx
          elif [ -f src/main.js ]; then
            echo "window.onerror = function() { return true; };" | cat - src/main.js > temp && mv temp src/main.js
          fi

      - name: Build Production Web Assets
        run: npm run build

      - name: Create Clean Android Platform Wrapper
        run: |
          rm -rf android
          npx cap init "Alarmio Pro" "com.alarmio.pro" --web-dir=dist || true
          npx cap add android
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug APK via Pure Native Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alarmio-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
