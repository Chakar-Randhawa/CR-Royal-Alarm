name: Build Android APK

# Builds a ready-to-install APK automatically on every push to main,
# and can also be triggered manually from the Actions tab.
# No third-party CI service (Codemagic etc.) is used — this runs
# entirely on GitHub's own runners.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform (generated fresh every build)
        run: |
          npx cap add android
          npx cap sync android

      - name: Copy custom native assets (notification icon + alarm sound)
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/raw
          cp android-assets/drawable/ic_alarm.xml android/app/src/main/res/drawable/ic_alarm.xml
          cp android-assets/raw/alarm_tone.wav android/app/src/main/res/raw/alarm_tone.wav

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cr-royal-alarm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------------------------------------------------------------
      # OPTIONAL: signed release APK.
      # Only runs if you've added these 4 repo secrets (Settings ->
      # Secrets and variables -> Actions):
      #   ANDROID_KEYSTORE_BASE64  (base64 of your .jks/.keystore file)
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # Until you add them, this step is skipped automatically and the
      # debug APK above is still produced normally.
      # ---------------------------------------------------------------
      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cr-royal-alarm-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
