name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inject Mobile Path Assets Patch (Fix Black Screen)
        run: |
          # Vite compile assets ko relative binary path engine par force karne ke liye
          if [ -f vite.config.ts ]; then
            sed -i "s|plugins:|base: './', plugins:|g" vite.config.ts
          elif [ -f vite.config.js ]; then
            sed -i "s|plugins:|base: './', plugins:|g" vite.config.js
          fi

      - name: Build Production Web Assets
        run: npm run build

      - name: Create Clean Android Platform Wrapper
        run: |
          rm -rf android
          npx cap init "Alarmio Pro" "com.alarmio.pro" --web-dir=dist || true
          npx cap add android
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug APK via Pure Native Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alarmio-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
