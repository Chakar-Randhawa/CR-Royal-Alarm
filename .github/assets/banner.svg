<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#160404"/>
      <stop offset="100%" stop-color="#2a0606"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffdede"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 40H1280 M0 80H1280 M0 120H1280 M0 160H1280 M0 200H1280 M0 240H1280 M0 280H1280"/>
    <path d="M80 0V320 M200 0V320 M320 0V320 M440 0V320 M560 0V320 M680 0V320 M800 0V320 M920 0V320 M1040 0V320 M1160 0V320"/>
  </g>

  <circle cx="185" cy="160" r="150" fill="url(#glow)"/>

  <!-- clock mark, scaled up from the app's own favicon geometry -->
  <g transform="translate(95,70) scale(3.6)" filter="url(#soft)">
    <path d="M5 3 2 6M22 6l-3-3" stroke="#ff6b6b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="13" r="9" fill="#000000" stroke="url(#ring)" stroke-width="1.8"/>
    <path d="M12 8v5l3 3" stroke="#ff8080" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="13" r="1.1" fill="#ff8080"/>
  </g>

  <!-- crown accent above the clock -->
  <g transform="translate(148,42)">
    <path d="M0 18 L7 0 L14 12 L21 0 L28 18 Z" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="7" cy="0" r="2" fill="#dc2626"/>
    <circle cx="14" cy="12" r="2" fill="#ff6b6b"/>
    <circle cx="21" cy="0" r="2" fill="#dc2626"/>
  </g>

  <!-- Title block -->
  <text x="360" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="4" fill="url(#titleFade)">CR ROYAL ALARM</text>
  <text x="362" y="188" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="3" fill="#c98a8a">A PREMIUM, 100% OFFLINE ANDROID ALARM CLOCK</text>

  <!-- divider -->
  <rect x="362" y="206" width="560" height="2" fill="#dc2626" opacity="0.55"/>

  <!-- feature chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#e8b4b4">
    <g transform="translate(362,236)">
      <rect width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#dc2626" stroke-opacity="0.5"/>
      <text x="16" y="20">React + TS</text>
    </g>
    <g transform="translate(502,236)">
      <rect width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#dc2626" stroke-opacity="0.5"/>
      <text x="16" y="20">Capacitor Native</text>
    </g>
    <g transform="translate(662,236)">
      <rect width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#dc2626" stroke-opacity="0.5"/>
      <text x="16" y="20">Zero Backend</text>
    </g>
    <g transform="translate(822,236)">
      <rect width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#dc2626" stroke-opacity="0.5"/>
      <text x="16" y="20">5 Themes</text>
    </g>
  </g>

  <text x="362" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7a3a3a" letter-spacing="1">CR DIGITAL ENTERPRISES  ·  FOUNDED BY CHAKAR RANDHAWA</text>
</svg>
