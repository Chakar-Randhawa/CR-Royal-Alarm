<svg width="1280" height="220" viewBox="0 0 1280 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1280" height="220" fill="#0a0a0a"/>
  <!-- 5 theme cards, 232px each with 20px gaps, starting x=20 -->

  <!-- Pure AMOLED -->
  <g transform="translate(20,20)">
    <rect width="232" height="180" rx="14" fill="#000000" stroke="#2a2a2a"/>
    <circle cx="30" cy="30" r="10" fill="#ffffff"/>
    <circle cx="56" cy="30" r="10" fill="#3b82f6"/>
    <rect x="18" y="60" width="196" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="18" y="78" width="140" height="8" rx="4" fill="#1a1a1a"/>
    <text x="18" y="130" font-size="17" font-weight="700" fill="#f5f5f5">Pure AMOLED</text>
    <text x="18" y="152" font-size="12" fill="#a3a3a3">Battery-saving true black</text>
  </g>

  <!-- Nordic Silver -->
  <g transform="translate(272,20)">
    <rect width="232" height="180" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="30" cy="30" r="10" fill="#0f172a"/>
    <circle cx="56" cy="30" r="10" fill="#0ea5e9"/>
    <rect x="18" y="60" width="196" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="18" y="78" width="140" height="8" rx="4" fill="#e2e8f0"/>
    <text x="18" y="130" font-size="17" font-weight="700" fill="#0f172a">Nordic Silver</text>
    <text x="18" y="152" font-size="12" fill="#475569">Premium ultra-clean light</text>
  </g>

  <!-- Midnight Deep Blue -->
  <g transform="translate(524,20)">
    <rect width="232" height="180" rx="14" fill="#0c1426" stroke="#2d3f5e"/>
    <circle cx="30" cy="30" r="10" fill="#60a5fa"/>
    <circle cx="56" cy="30" r="10" fill="#818cf8"/>
    <rect x="18" y="60" width="196" height="10" rx="5" fill="#1a2942"/>
    <rect x="18" y="78" width="140" height="8" rx="4" fill="#1a2942"/>
    <text x="18" y="130" font-size="17" font-weight="700" fill="#e2e8f0">Midnight Deep Blue</text>
    <text x="18" y="152" font-size="12" fill="#94a3b8">Luxurious calming dark</text>
  </g>

  <!-- Forest Moss & Sage -->
  <g transform="translate(776,20)">
    <rect width="232" height="180" rx="14" fill="#141b13" stroke="#3a4a35"/>
    <circle cx="30" cy="30" r="10" fill="#84cc16"/>
    <circle cx="56" cy="30" r="10" fill="#facc15"/>
    <rect x="18" y="60" width="196" height="10" rx="5" fill="#22301f"/>
    <rect x="18" y="78" width="140" height="8" rx="4" fill="#22301f"/>
    <text x="18" y="130" font-size="17" font-weight="700" fill="#e7f0e3">Forest Moss &amp; Sage</text>
    <text x="18" y="152" font-size="12" fill="#a6b89e">Organic earth-toned</text>
  </g>

  <!-- Royal Crimson -->
  <g transform="translate(1028,20)">
    <rect width="232" height="180" rx="14" fill="#150505" stroke="#dc2626"/>
    <circle cx="30" cy="30" r="10" fill="#dc2626"/>
    <circle cx="56" cy="30" r="10" fill="#ff8080"/>
    <rect x="18" y="60" width="196" height="10" rx="5" fill="#2a0a0a"/>
    <rect x="18" y="78" width="140" height="8" rx="4" fill="#2a0a0a"/>
    <text x="18" y="130" font-size="17" font-weight="700" fill="#f5d0d0">Royal Crimson</text>
    <text x="18" y="152" font-size="12" fill="#c98a8a">High-contrast industrial</text>
  </g>
</svg>
